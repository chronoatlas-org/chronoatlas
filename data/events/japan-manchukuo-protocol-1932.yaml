id: japan-manchukuo-protocol-1932
wikidata: Q702574
title: Japan–Manchukuo Protocol
date: 1932-09-15
summary: >-
  Japan and Manchukuo signed a protocol at Hsinking (Changchun) by which Japan recognized
  Manchukuo. Its preamble states that Japan recognized that Manchukuo had organized and
  established itself as an independent state in accordance with the free will of its
  inhabitants. Manchukuo was to confirm and respect the rights and interests that Japan and its
  subjects held there under earlier Sino-Japanese treaties, agreements and contracts, and the two
  agreed to cooperate in their national security, with such Japanese forces as were needed
  stationed in Manchukuo. It took effect on signature, by Japan's ambassador, Nobuyoshi Muto, and
  Manchukuo's Prime Minister. According to China's Legation in Washington, China's government
  protested to Japan, instructed its representative at Geneva to bring the matter before the
  League of Nations, and urged the parties to the Nine-Power Treaty to call a conference.
polities: [empire-of-japan, manchukuo, china]
