id: mukden-incident-1931
wikidata: Q242099
title: Mukden incident
date: 1931-09-18
summary: >-
  Fighting broke out between Japanese and Chinese troops at Mukden, in Manchuria, on the night
  of 18 September 1931, and the two governments' accounts differed. According to a report from
  the Chinese side, relayed that night to the US Minister in Peiping by an adviser to Marshal
  Chang Hsueh-liang, Japanese soldiers were firing on the Chinese army's east camp, the arsenal
  and the city, and the Marshal had ordered his soldiers to stay in their barracks and not to
  retaliate. Japan's government stated on 24 September that Chinese troops had destroyed South
  Manchuria Railway track near Mukden and attacked Japanese railway guards, and that its army had
  to act swiftly because the guards were greatly outnumbered and Japanese residents were in
  danger. The League of Nations' Commission of Enquiry (the Lytton Commission) later found that
  the Chinese forces made no concerted or authorized attack and were taken by surprise; that an
  explosion did occur on or near the railway between 10 and 10.30 p.m., but any damage was not
  enough in itself to justify military action; and that the Japanese army's operations that night
  could not be accepted as legitimate self-defence, while allowing that officers on the spot may
  have believed they were defending themselves. When the report was published, a spokesman for
  Japan's Foreign Office called it unfair to Japan, and the War Office objected in particular to
  its rejection of Japan's plea of self-defence.
polities: [china, empire-of-japan]
importance: 5
