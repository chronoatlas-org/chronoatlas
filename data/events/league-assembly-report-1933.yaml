id: league-assembly-report-1933
title: League Assembly adopts its report on the Sino-Japanese dispute
date: 1933-02-24
summary: >-
  A special session of the League of Nations Assembly adopted a report on the dispute between
  China and Japan, under Article 15 of the League's Covenant. According to the US Consul at
  Geneva, of 44 states taking part in the vote, 42 voted for it, including China; Japan voted
  against, and Siam abstained. The Assembly's President announced that under the procedure that
  applied, the report was adopted unanimously. China's delegate said China would accept its
  recommendations without reserve. Japan's delegate, Matsuoka, said Japan could not accept the
  report. In a final statement after the vote, he said Japan had reached the limit of its efforts
  to cooperate with the League over the dispute, and the Japanese delegation then left the
  Assembly room. That afternoon the Assembly set up an Advisory Committee to follow the
  situation, and invited the United States and the Soviet Union to cooperate in its work.
polities: [china, empire-of-japan]
importance: 4
