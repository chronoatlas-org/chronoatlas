id: japan-league-withdrawal-1933
title: Japan gives notice of withdrawal from the League of Nations
date: 1933-03-27
summary: >-
  Japan's government gave the League of Nations notice of its withdrawal from the League, in a
  telegram dated 27 March 1933, about a month after the League's Assembly had adopted its report
  on the dispute with China against Japan's vote. The League's Secretary-General reported the
  telegram, and his reply, to the Assembly's Advisory Committee the next day. Two days before the
  notice, Japan's Ambassador in Washington had told the US Under Secretary of State that Japan
  would withdraw, but would keep cooperating with the League on disarmament. China's Minister for
  Foreign Affairs, Lo Wen-kan, said in a statement that under the League's Covenant a member
  could withdraw only after two years' notice and once its obligations had been fulfilled, so
  the League's resolutions on the dispute still bound Japan.
polities: [empire-of-japan, china]
importance: 4
sources:
