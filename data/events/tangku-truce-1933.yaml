id: tangku-truce-1933
wikidata: Q715590
title: Tangku Truce
date: 1933-05-31
summary: >-
  Chinese and Japanese military authorities signed a truce at Tangku. The Chinese army was to
  withdraw to the west and south of a line from Yen-Ching through Chang-Ping, Tung-Chow and other
  places to Lu-Tai, and not to advance beyond it or provoke hostilities. The Japanese army could
  check the withdrawal by aircraft or other means; once it had done so, it undertook not to cross
  the line or continue attacking Chinese troops, and to withdraw to the Great Wall. Chinese police
  were to keep order in the area between the line and the Great Wall. The truce took effect when
  it was signed.
polities: [china, empire-of-japan]
