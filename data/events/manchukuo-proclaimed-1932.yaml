id: manchukuo-proclaimed-1932
title: Proclamation of Manchukuo
date: 1932-03-01
summary: >-
  A proclamation made public at Mukden on the morning of 1 March 1932 announced a complete break
  with the Republic of China and the establishment of the state of Manchukuo, according to the US
  Consul General there. Chang Ching-hui announced it at his residence. The proclamation criticized
  conditions under the Republic, set out the new state's principles, including acknowledging the
  territory's debt obligations, the open door and equal opportunity, and said foreign governments
  would be notified. On 23 February, China's government had declared that the Three Eastern
  Provinces (Manchuria) were an integral part of China, that the Japanese authorities occupying
  them were trying to set up a so-called independent government there, and that it would not
  recognize the secession or independence of any part of them, or any administration organized
  there without its authority and consent. The League of Nations' Commission of Enquiry concluded
  that the new state could not have been formed without the presence of Japanese troops and the
  activities of Japanese officials, and so was not the result of a genuine, spontaneous movement
  for independence. When Japan recognized Manchukuo in September 1932, it stated that Manchukuo
  had established itself as an independent state in accordance with the free will of its
  inhabitants.
polities: [manchukuo, china, empire-of-japan]
effects: [ohm-r2885965]
importance: 5
