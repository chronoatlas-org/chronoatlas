id: us-non-recognition-note-1932
title: US non-recognition note to Japan and China
date: 1932-01-07
summary: >-
  On 7 January 1932, the US Secretary of State, Stimson, instructed the US Ambassador in Japan to
  deliver a note to Japan's government, and sent an identical note to China's. It said that the
  recent military operations around Chinchow had destroyed the last administrative authority
  that China's government had held in South Manchuria before 18 September 1931. The United
  States, it said, could not admit the legality of any de facto situation, nor recognize any
  treaty or agreement between the two governments, which might impair US treaty rights in China,
  including those relating to China's sovereignty, independence, and territorial and
  administrative integrity, or to the open door policy. Nor would it recognize any situation,
  treaty or agreement brought about by means contrary to the Pact of Paris of 1928, to which
  China, Japan and the United States were all parties.
polities: [united-states, empire-of-japan, china]
importance: 3
