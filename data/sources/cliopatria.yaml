  (https://creativecommons.org/licenses/by/4.0/). Simplified and converted by chronoatlas.
notes: >-
  A worldwide dataset of the territory held by polities, 3400 BCE to 2024 CE, sampled at
  varying time steps (whole years). It doesn't distinguish control from legal sovereignty, and
  it folds some governments into their patrons (Manchukuo is inside the Empire of Japan). Used
  here as the baseline outside OpenHistoricalMap’s coverage and as a "second opinion" inside
  it. See data/imports/cliopatria/manifest.json for how its data is
  interpreted.
