# Which of our polities (data/polities/, drawn from OpenHistoricalMap) is the same as each
# Cliopatria polity. HAND-WRITTEN and reviewed like any data change: the import script never
# overwrites it. It lives in this folder because it's built on Cliopatria's data (CC BY 4.0).
#
# Every match rests on evidence in the data, stated in `why`: the same Wikidata ID, or the same
# name in overlapping years. Cliopatria's Wikidata IDs are not trusted on their own: some are
# wrong for this period (its "Republic of China" rows carry Q148, the People's Republic of
# China, and its "Republic of Korea" row carries Q423, North Korea).
#
# Kinds (see data/imports/cshapes-2-0/polity-crosswalk.yaml): same-state means the same polity.
#
# Not matched, on purpose: the warring factions in China (Kuomintang, Communist Party of China,
# Chinese Communists, Anti-Kuomintang Coalition, Empire of China). For the Kuomintang this was
# confirmed by the maintainers on 2026-09-28 (Phase 3 decision 14): Cliopatria keeps it as a polity
# of its own beside its "Republic of China" in 1917–1929, so it isn't the same state. Also not
# matched: the East Turkestan Republic, the Great Mongol State, the European states and colonial
# empires (their East Asian land was small concessions and colonies we record separately), and
# Pakistan and India (whose Cliopatria names and years don't line up with ours).

- unit: cliopatria-british-raj
  matches:
    - polity: british-raj
      kind: same-state
      why: The same Wikidata ID (Q129286).

- unit: cliopatria-burma
  matches:
    - polity: burma
      kind: same-state
      why: The same name ("Burma") in overlapping years (Cliopatria 1948 on; ours 1948–1977).

- unit: cliopatria-democratic-people-s-republic-of-korea
  matches:
    - polity: north-korea-1948-1953
      kind: same-state
      why: The same Wikidata ID (Q423).

- unit: cliopatria-emirate-of-afghanistan
  matches:
    - polity: emirate-of-afghanistan
      kind: same-state
      why: The same name ("Emirate of Afghanistan") in overlapping years.

- unit: cliopatria-empire-of-japan
