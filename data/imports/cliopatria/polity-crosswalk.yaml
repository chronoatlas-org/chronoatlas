      kind: same-state
      why: The same name ("Empire of Japan") in overlapping years.

- unit: cliopatria-french-indochina
  matches:
    - polity: indochinese-union
      kind: same-state
      why: >-
        Our polity's names include "Indochiny Francuskie" (Polish for "French Indochina"), and
        the years overlap (Cliopatria 1900–1952; ours 1893–1941).
    - polity: indochinese-federation
      kind: same-state
      why: >-
        Our polity's names include "Indochiny Francuskie" (Polish for "French Indochina"), and
        the years overlap (ours 1941–1945).

