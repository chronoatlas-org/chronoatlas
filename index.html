<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page use the full screen on phones with notches; the CSS
         keeps controls clear of the notch and home indicator with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>chronoatlas</title>
    <meta
      name="description"
      content="An open-source interactive map of how the world's borders changed through history, with every border and event traced to a named source."
    />
  </head>
  <body>
    <!-- Text in elements with data-i18n comes from the translation catalogs (src/i18n);
         data-i18n-label sets a translated accessible label and tooltip. -->
    <header class="app-header">
      <div class="app-header-top">
        <h1>chronoatlas</h1>
        <div class="app-header-actions">
          <button
            type="button"
            id="nearby-button"
            class="share-button"
            data-i18n-label="nearby.label"
            aria-controls="panel"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h2v2H4zm4 0h12v2H8zm-4 5h2v2H4zm4 0h12v2H8zm-4 5h2v2H4zm4 0h12v2H8z" />
            </svg>
            <span class="optional-label" data-i18n="nearby.button"></span>
          </button>
          <button type="button" id="share-button" class="share-button" data-i18n-label="share.label">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a3 3 0 1 1 4.2 4.2l-2 2-1.4-1.4 2-2a1 1 0 1 0-1.4-1.4L12 13.4a1 1 0 0 1-1.4 0zm2.8-2.8a1 1 0 0 1 0 1.4l-3.5 3.5a3 3 0 1 1-4.2-4.2l2-2 1.4 1.4-2 2a1 1 0 1 0 1.4 1.4L12 10.6a1 1 0 0 1 1.4 0z" />
            </svg>
            <span data-i18n="share.button"></span>
          </button>
        </div>
      </div>
      <p class="app-notice" data-i18n="app.previewNotice"></p>
      <!-- Which borders the map shows (src/main.ts): as administered, or as legally recognized. -->
      <div class="view-controls">
        <div class="view-switch" role="group" data-i18n-label="view.label">
          <button type="button" data-view="facto" aria-pressed="true">
            <span class="label-long" data-i18n="view.facto"></span><span class="label-short" data-i18n="view.factoShort"></span>
          </button>
          <button type="button" data-view="jure" aria-pressed="false">
            <span class="label-long" data-i18n="view.jure"></span><span class="label-short" data-i18n="view.jureShort"></span>
          </button>
        </div>
        <button type="button" id="second-opinion" class="second-opinion" aria-pressed="false">
          <span class="label-long" data-i18n="view.second"></span><span class="label-short" data-i18n="view.secondShort"></span>
        </button>
      </div>
      <!-- The map key: open on wider screens, folded on phones (src/main.ts). -->
      <details class="map-key" open>
      <summary data-i18n="legend.title"></summary>
      <p class="legend">
        <span class="legend-item"><span class="legend-no-data" aria-hidden="true"></span><span data-i18n="legend.noData"></span></span>
        <span class="legend-item"><span class="legend-contested" aria-hidden="true"></span><span data-i18n="legend.contested"></span></span>
        <span class="legend-item"><span class="legend-line" aria-hidden="true"></span><span data-i18n="legend.line"></span></span>
        <span class="legend-item" data-precision="approximate-line" hidden><span class="legend-line legend-line-approximate" aria-hidden="true"></span><span data-i18n="legend.approximate"></span></span>
        <span class="legend-item" data-precision="frontier-zone" hidden><span class="legend-line legend-line-zone" aria-hidden="true"></span><span data-i18n="legend.zone"></span></span>
        <span class="legend-item"><span class="legend-edge" aria-hidden="true"></span><span data-i18n="legend.edge"></span></span>
        <span class="legend-item legend-baseline-item" hidden><span class="legend-line legend-line-baseline" aria-hidden="true"></span><span data-i18n="legend.baseline"></span></span>
        <span class="legend-item"><span class="legend-water" aria-hidden="true"></span><span data-i18n="legend.water"></span></span>
      </p>
      <p class="legend legend-jure" hidden data-i18n="legend.jure"></p>
      <p class="legend legend-second" hidden>
        <span class="legend-item"><span class="legend-second-line" aria-hidden="true"></span><span data-i18n="legend.second"></span></span>
        <span class="legend-item legend-differ-item"><span class="legend-differ" aria-hidden="true"></span><span data-i18n="legend.differ"></span></span>
      </p>
      </details>
      <p id="share-status" class="share-status" role="status" aria-live="polite"></p>
    </header>
    <main id="map"></main>
    <!-- The territory panel (src/panel/), filled in when a territory is selected. -->
    <aside id="panel" class="panel" hidden aria-labelledby="panel-title"></aside>
    <section id="timeline"></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
