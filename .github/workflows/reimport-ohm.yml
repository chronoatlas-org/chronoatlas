# A "Run workflow" button (Actions tab → "Re-import OpenHistoricalMap") that re-imports the borders
# from OpenHistoricalMap and opens a pull request with the changes, to be reviewed like any other.
# Nothing is merged automatically. See docs/phase-4-plan.md (section 4) and docs/reviewing.md.
#
# - Only people with write access to the repository can start it, and only on main. Start it while
#   signed in as the project account: the run page shows who started it.
# - It needs the repository setting "Allow GitHub Actions to create and approve pull requests"
#   (Settings → Actions → General → Workflow permissions). Without it, opening the pull request
#   fails, and the run says so.
# - A pull request opened by a workflow doesn't start other workflows (GitHub prevents loops), so
#   this workflow posts the data-change summary itself and starts the build check on the branch.
# - CShapes and Cliopatria are pinned to exact versions and have no button: a new version is a
#   license and interpretation review, done by hand.

name: Re-import OpenHistoricalMap

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why (optional): for example, a link to the OpenHistoricalMap change or the issue it fixes'
        required: false
        type: string

# Nothing by default; the job below asks for what it needs.
permissions: {}

# One re-import at a time; a second waits instead of cancelling the first.
concurrency:
  group: reimport-ohm
  cancel-in-progress: false

jobs:
  reimport:
    # Only from main, so it always runs the reviewed import script.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # to push the branch with the re-imported data
      pull-requests: write # to open the pull request and post its summary
      actions: write # to start the build check on the new branch
    env:
      TZ: UTC # commit times in UTC, as for every commit in this project
    steps:
      # Keeps the token (the default), to push the branch. Only main's code runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Re-import from OpenHistoricalMap
        run: npm run import:ohm
      - name: See whether anything changed
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed in OpenHistoricalMap's data for our area and years since the last import, so there's no pull request." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the data
        id: validate
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true # a problem is reported on the pull request rather than hidden
        run: npm run validate
      - name: Summarize the changes
        if: steps.changes.outputs.changed == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm run summarize-changes -- --base-ref HEAD --out summary/comment.md --full summary/full.md --full-url "$RUN_URL"
          cat summary/full.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit, push, and open the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Inputs and results reach the commands as variables, never pasted into them.
          REASON: ${{ inputs.reason }}
          VALIDATE: ${{ steps.validate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          day="$(date -u +%Y-%m-%d)"
          branch="import/openhistoricalmap-${day}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add -- data
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Re-import OpenHistoricalMap (${day})" -m "Made by the Re-import OpenHistoricalMap workflow: ${RUN_URL}"
          git push -q origin "$branch"
          {
            echo "Re-imported from OpenHistoricalMap by the **Re-import OpenHistoricalMap** workflow ([run](${RUN_URL}))."
            echo
            if [ -n "$REASON" ]; then printf '**Why:** %s\n\n' "$REASON"; fi
            if [ "$VALIDATE" = "success" ]; then
              echo '**Checks:** `npm run validate` passed. The build check runs on this branch too.'
            else
              echo '**Checks:** ❌ `npm run validate` found problems; see the run above. Fix them in OpenHistoricalMap and re-import, rather than editing these files.'
            fi
            echo
            echo 'The data-change summary is in the first comment. Review this like any data change ([how review works](https://github.com/chronoatlas-org/chronoatlas/blob/main/CONTRIBUTING.md#how-review-works)): other people edit OpenHistoricalMap too, so look at every changed border, not only the one you expected. Nothing is merged automatically.'
          } > summary/body.md
          url="$(gh pr create --base "$BASE" --head "$branch" --title "Re-import OpenHistoricalMap (${day})" --body-file summary/body.md)"
          gh pr comment "$url" --body-file summary/comment.md
          # A pull request opened by this workflow starts no checks by itself; start the build here.
          gh workflow run deploy.yml --ref "$branch"
          echo "Opened ${url}" >> "$GITHUB_STEP_SUMMARY"
